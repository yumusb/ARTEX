# 推送到 GitHub Container Registry 的多架构镜像。
#
# 与 release.yml 的分工：那边只在打 v* tag 时发布正式版到 Docker Hub；
# 这边用于「分支验证」——推到个人 fork 的 ghcr，随时拉取测试某个修复，
# 不必等原作者发版。镜像内容与 release.yml 完全一致（同样的 Dockerfile、
# 同样的三段式构建：前端静态导出 → Linux 交叉编译 → 装环境+放二进制）。
#
# 认证用仓库自带的 GITHUB_TOKEN，无需任何 secret：包只写进本仓库的
# packages namespace，fork 场景下权限自动具备。
name: docker-ghcr
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # 推 ghcr 包

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ① 前端静态导出（一次），产物给交叉编译内嵌进二进制
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Linux 交叉编译（-tags embedui 内嵌前端产物）
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.sha }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # 不开 UPX：自解压 ELF 在部分内核 / 虚拟化 / 安全策略下会崩，
          # 验证镜像优先保证可移植性。
          ARTEX_COMPRESS: "0"
        run: ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test binary
        if: matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      # 二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 镜像 → 推 ghcr（复用 binaries 编好的二进制，镜像里只装环境）
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
